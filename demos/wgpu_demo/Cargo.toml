[package]
name = "wgpu_demo"
version.workspace = true
edition.workspace = true
# `winit`/`wgpu` 24 require newer Rust than the workspace default.
rust-version = "1.76"
license.workspace = true
publish = false

[[bin]]
name = "wgpu_demo"
path = "src/main.rs"

[dependencies]
draw_backend_wgpu.workspace = true
draw_core.workspace = true
draw_render.workspace = true
draw_scene.workspace = true
draw_ui.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.30"
