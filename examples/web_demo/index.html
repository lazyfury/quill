<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>quill — Notes</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a0a; }
    #canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script type="module">
    import init from './dist/web_demo.js';

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function hasPaintedPixels() {
      const canvas = document.getElementById('canvas');
      try {
        const data = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
        for (let i = 0; i < data.length; i += 4) {
          if (data[i] > 80 || data[i + 1] > 80 || data[i + 2] > 100) return true;
        }
      } catch (err) {
        console.error(err);
      }
      return false;
    }

    // Headless smoke test: dispatch real pointer events at the button and verify
    // the UI click state changed. Open with ?selftest=1.
    async function selfTest() {
      await wait(600); // let the first frames render
      const canvas = document.getElementById('canvas');
      const [x, y] = (document.body.dataset.quillButton || '').split(',').map(Number);
      const before = Number(document.body.dataset.quillClicks);
      if (!Number.isFinite(x) || !Number.isFinite(y)) throw new Error('no button probe');

      const opts = { clientX: x, clientY: y, bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse', isPrimary: true };
      canvas.dispatchEvent(new PointerEvent('pointermove', { ...opts }));
      canvas.dispatchEvent(new PointerEvent('pointerdown', { ...opts, button: 0, buttons: 1 }));
      canvas.dispatchEvent(new PointerEvent('pointerup', { ...opts, button: 0, buttons: 0 }));

      let after = before;
      for (let i = 0; i < 40 && after <= before; i++) {
        await wait(50);
        after = Number(document.body.dataset.quillClicks);
      }
      document.body.setAttribute('data-quill-status', after === before + 1 ? 'clicked' : `fail(${before}->${after})`);
    }

    init()
      .then(async () => {
        await wait(300);
        if (new URLSearchParams(location.search).has('selftest')) {
          await selfTest();
        } else {
          document.body.setAttribute('data-quill-status', hasPaintedPixels() ? 'painted' : 'blank');
        }
      })
      .catch((err) => {
        document.body.setAttribute('data-quill-status', 'error');
        document.body.innerHTML = '<pre style="color:#f88;padding:16px">' + err + '</pre>';
        console.error(err);
      });
  </script>
</body>
</html>
