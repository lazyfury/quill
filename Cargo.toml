[workspace]
resolver = "2"
members = [
    "crates/draw_core",
    "crates/draw_scene",
    "crates/draw_ui",
    "crates/draw_render",
    "crates/draw_backend_canvas",
    "crates/draw_backend_recording",
    "crates/draw_backend_coregraphics",
    "crates/draw_wasm",
    "demos/web_demo",
    "demos/component_demo",
    "demos/macos_demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = ""

[workspace.dependencies]
draw_core = { path = "crates/draw_core" }
draw_scene = { path = "crates/draw_scene" }
draw_ui = { path = "crates/draw_ui" }
draw_render = { path = "crates/draw_render" }
draw_backend_canvas = { path = "crates/draw_backend_canvas" }
draw_backend_recording = { path = "crates/draw_backend_recording" }
draw_backend_coregraphics = { path = "crates/draw_backend_coregraphics" }
draw_wasm = { path = "crates/draw_wasm" }

[profile.release]
opt-level = "s"
lto = true
