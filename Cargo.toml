[workspace]
resolver = "2"
members = [
    "crates/draw_core",
    "crates/draw_scene",
    "crates/draw_ui",
    "crates/draw_theme",
    "crates/draw_components",
    "crates/draw_render",
    "crates/draw_ffi",
    "crates/draw_font",
    "crates/draw_svg",
    "crates/draw_profile",
    "crates/draw_debug_ui",
    "crates/draw_bench",
    "crates/draw_bench_suite",
    "crates/draw_backend_canvas",
    "crates/draw_backend_recording",
    "crates/draw_backend_wgpu",
    "crates/draw_wasm",
    "crates/draw_anim",
    "crates/draw_assets",
    "quill",
    "examples/web_demo",
    "examples/demo_app",
    "examples/demoapp_ffi",
    "examples/wgpu_ffi",
    "examples/wgpu_demo",
    "examples/multi_tree",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = ""

[workspace.dependencies]
draw_core = { path = "crates/draw_core" }
draw_scene = { path = "crates/draw_scene" }
draw_ui = { path = "crates/draw_ui" }
draw_theme = { path = "crates/draw_theme" }
draw_components = { path = "crates/draw_components" }
draw_render = { path = "crates/draw_render" }
draw_ffi = { path = "crates/draw_ffi" }
draw_font = { path = "crates/draw_font" }
draw_svg = { path = "crates/draw_svg" }
draw_profile = { path = "crates/draw_profile" }
draw_debug_ui = { path = "crates/draw_debug_ui" }
draw_bench = { path = "crates/draw_bench" }
draw_bench_suite = { path = "crates/draw_bench_suite" }
draw_backend_canvas = { path = "crates/draw_backend_canvas" }
draw_backend_recording = { path = "crates/draw_backend_recording" }
draw_backend_wgpu = { path = "crates/draw_backend_wgpu" }
draw_wasm = { path = "crates/draw_wasm" }
draw_anim = { path = "crates/draw_anim" }
draw_assets = { path = "crates/draw_assets" }
demo_app = { path = "examples/demo_app" }

[profile.release]
opt-level = "s"
lto = true

# Benchmarks inherit `release` but want throughput-oriented codegen, not size.
[profile.bench]
opt-level = 3
